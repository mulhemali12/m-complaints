<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مقترحات وشكاوى المستفيدين - الهلال الأحمر العربي السوري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-logo {
            width: 120px;
            height: auto;
            margin-bottom: 25px;
        }
        .form-box {
            width: 100%;
            margin-bottom: 20px;
        }
        .red-input, .red-textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #d9534f;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            background-color: #ffffff;
            text-align: right;
            font-family: inherit;
        }
        .red-textarea {
            resize: vertical;
            height: 130px;
        }
        select.red-input {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23d9534f' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: left 10px center;
        }
        .btn-send {
            width: 100%;
            background-color: #d9534f;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.2);
            text-align: center;
        }
        .btn-send:hover {
            background-color: #c9302c;
        }
        .footer-logos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px dashed #dddddd;
        }
        .bottom-logo-left {
            height: 55px;
            width: auto;
        }
        .bottom-logo-right {
            height: 65px;
            width: auto;
        }
    </style>
</head>
<body>

<div class="main-card">
    <!-- 🔴 1. الشعار العلوي الدائري محقون كـ كود نصي مستقل ومحمي 100% من الحظر -->
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100' width='100' height='100'><circle cx='50' cy='50' r='46' fill='none' stroke='%23d9534f' stroke-width='4'/><path d='M50,15 A35,35 0 0,0 50,85 A28,28 0 0,1 50,15 Z' fill='%23d9534f'/><text x='50' y='96' font-family='Segoe UI, Tahoma' font-size='6' font-weight='bold' fill='%23333' text-anchor='middle'>الهلال الأحمر العربي السوري</text></svg>" class="top-logo" alt="SARC">
    
    <form action="submit_complaint.php" method="POST" style="width: 100%;">
        <div class="form-box">
            <select name="clinic" class="red-input" required>
                <option value="" disabled selected>يرجى اختيار العيادة أو القسم المعني...</option>
                <option value="استقبال">قسم الاستقبال والتسجيل</option>
                <option value="صيدلية">قسم الصيدلية وصرف الأدوية</option>
                <option value="داخلية">عيادة الداخلية</option>
                <option value="أطفال">عيادة الأطفال</option>
                <option value="نسائية">عيادة النسائية</option>
                <option value="أسنان">عيادة الأسنان</option>
                <option value="نفسية">عيادة النفسية</option>
                <option value="تغذية">عيادة التغذية</option>
                <option value="مخبر">قسم المخبر والتحاليل الطبية</option>
                <option value="عام">ملاحظة عامة عن المستوصف</option>
            </select>
        </div>
        
        <div class="form-box">
            <textarea name="complaint_text" class="red-textarea" placeholder="يرجى كتابة مقترحك أو تفاصيل الشكوى بصدق وسرية هنا..." required></textarea>
        </div>
        
        <button type="submit" class="btn-send">🚀 إرسال المقترح / الشكوى بصفة سرية</button>
    </form>
    
    <!-- 🔴 2. الشعارات السفلية التأسيسية محقونة ومحمية داخلياً كأكواد رسومية فائقة النقاوة (Vector SVG) -->
    <div class="footer-logos">
        <!-- شعار الهلال والنواة الإنسانية المطور والمحمي -->
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 80 60' width='80' height='60'><path d='M25,15 A20,20 0 0,0 25,50 A16,16 0 0,1 25,15 Z' fill='%23d9534f'/><circle cx='55' cy='32' r='10' fill='none' stroke='%23333' stroke-width='2'/><line x1='55' y1='15' x2='55' y2='22' stroke='%23333' stroke-width='2'/><line x1='55' y1='42' x2='55' y2='50' stroke='%23333' stroke-width='2'/><text x='55' y='58' font-family='Segoe UI' font-size='6' fill='%23666' text-anchor='middle'>الإنسانية</text></svg>" class="bottom-logo-left" alt="Humanity">
        
        <!-- شعار ومستمرون بالإنسانية - 82 عاماً محقون داخلياً -->
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 60' width='100' height='60'><rect x='5' y='10' width='90' height='40' rx='5' fill='none' stroke='%23d9534f' stroke-width='1.5' stroke-dasharray='3,3'/><text x='50' y='30' font-family='Segoe UI, Tahoma' font-size='11' font-weight='bold' fill='%23d9534f' text-anchor='middle'>82 عاماً</text><text x='50' y='44' font-family='Segoe UI, Tahoma' font-size='8' fill='%23333' text-anchor='middle'>ومستمرون بالإنسانية</text></svg>" class="bottom-logo-right" alt="82 Years">
    </div>
</div>

</body>
</html>

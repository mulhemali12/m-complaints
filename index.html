<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مقترحات وشكاوى المستفيدين - الهلال الأحمر العربي السوري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-logo {
            width: 130px;
            height: auto;
            margin-bottom: 15px;
        }
        .clinic-title {
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-box {
            width: 100%;
            margin-bottom: 20px;
        }
        .red-input, .red-textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #d9534f;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            background-color: #ffffff;
            text-align: right;
            font-family: inherit;
        }
        .red-textarea {
            resize: vertical;
            height: 140px;
        }
        select.red-input {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23d9534f' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: left 10px center;
        }
        /* أنيق ومخصص لصندوق الأسماء التفاعلي المنبثق */
        .staff-box {
            display: none; /* يظل مخفياً صامتاً لحين اختيار عيادة معينة */
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-send {
            width: 100%;
            background-color: #d9534f;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.2);
            text-align: center;
            margin-top: 5px;
        }
        .btn-send:hover {
            background-color: #c9302c;
        }
        .footer-logos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px dashed #dddddd;
        }
        .bottom-logo-left {
            height: 65px;
            width: auto;
        }
        .bottom-logo-right {
            height: 75px;
            width: auto;
        }
    </style>
</head>
<body>

<div class="main-card">
    <img src="top-logo.png" class="top-logo" alt="شعار الهلال الأحمر العربي السوري">
    
    <div class="clinic-title">
        شكاوي الهلال الأحمر العربي السوري<br>مستوصف شطحة
    </div>
    
    <!-- فورم الإرسال ومضاف إليه حقل خفي لتمرير اسم الموظف المختار لجدول أكسس -->
    <form action="server.js" method="POST" style="width: 100%;">


        
        <!-- 1. قائمة اختيار القسم الرئيسي -->
        <div class="form-box">
            <select name="clinic" id="clinicSelect" class="red-input" onchange="updateStaffList()" required>
                <option value="" disabled selected>يرجى اختيار العيادة أو القسم المعني...</option>
                <option value="استقبال">قسم الاستقبال والتسجيل</option>
                <option value="صيدلية">قسم الصيدلية وصرف الأدوية</option>
                <option value="داخلية">عيادة الداخلية</option>
                <option value="نسائية">عيادة النسائية</option>
                <option value="أطفال">عيادة الأطفال</option>
                <option value="عام">ملاحظة عامة عن المستوصف</option>
            </select>
        </div>
        
        <!-- ⚡ 2. رادار الأساخ الحركي المنبثق تلقائياً بناءً على القسم المختار ⚡ -->
        <div class="form-box staff-box" id="staffContainer">
            <select name="staff_name" id="staffSelect" class="red-input">
                <!-- يتم شحن الأسماء حياً بحي عبر الجافا سكريبت بالأسفل -->
            </select>
        </div>
        
        <div class="form-box">
            <textarea name="complaint_text" class="red-textarea" placeholder="يرجى كتابة مقترحك أو تفاصيل الشكوى بصدق وسرية هنا..." required></textarea>
        </div>
        
        <button type="submit" class="btn-send"> إرسال المقترح / الشكوى بصفة سرية</button>
    </form>
    
    <div class="footer-logos">
        <img src="humanity-logo.png" class="bottom-logo-left" alt="معاً من أجل الإنسانية">
        <img src="82-years.png" class="bottom-logo-right" alt="مستمرون بالإنسانية 82 عاماً">
    </div>
</div>

<!-- ==================================================== -->
<!-- 🧠 محرك الجافا سكريبت الذكي لحقن وتمرير أسماء الموظفين للأقسام -->
<!-- ==================================================== -->
<script>
function updateStaffList() {
    var clinicSelect = document.getElementById("clinicSelect");
    var staffContainer = document.getElementById("staffContainer");
    var staffSelect = document.getElementById("staffSelect");
    
    var selectedClinic = clinicSelect.value;
    
    // تصفير الخيارات السابقة بالكامل حماية للذاكرة
    staffSelect.innerHTML = "";
    
    // مصفوفة شحن الموظفين والأطباء الفعليين لمستوصف شطحة بالملي بحسب طلبك
    var staffOptions = [];
    
    if (selectedClinic === "استقبال") {
        staffOptions = ["مرفت الدريوسي", "فرح خضور", "شخص آخر / القسم ككل"];
    } else if (selectedClinic === "صيدلية") {
        staffOptions = ["رزان زلخة", "ايناث نصرة", "شخص آخر / القسم ككل"];
    } else if (selectedClinic === "داخلية") {
        staffOptions = ["د. حسين حسن", "مجدلين جعفر", "شخص آخر / القسم ككل"];
    } else if (selectedClinic === "نسائية") {
        staffOptions = ["د. اليانور عبود", "فرح أسعد", "شخص آخر / القسم ككل"];
    } else if (selectedClinic === "أطفال") {
        staffOptions = ["ضحى محفوض", "شخص آخر / القسم ككل"];
    } else if (selectedClinic === "عام") {
        staffOptions = ["ملهم علي", "صالح حسن", "لوجين علي", "شخص آخر / القسم ككل"];
    }
    
    // إذا وجدنا موظفين مسجلين للقسم، نفتح الصندوق ونحقن الأسماء فوراُ
    if (staffOptions.length > 0) {
        // إضافة خيار توجيهي افتراضي ناصع
        var defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.text = "يرجى تحديد الموظف أو الطبيب المقصود بالشكوى...";
        defaultOpt.disabled = true;
        defaultOpt.selected = true;
        staffSelect.appendChild(defaultOpt);
        
        // حقن الخيارات الحية بالأسماء
        staffOptions.forEach(function(name) {
            var opt = document.createElement("option");
            opt.value = name;
            opt.text = name;
            staffSelect.appendChild(opt);
        });
        
        // فتح وإظهار الحقل بصرياً بحركة انسيابية مريحة
        staffContainer.style.display = "block";
        staffSelect.required = true;
    } else {
        // إخفاء الحقل صامتاً إذا لم يكن هناك أسماء مخصصة
        staffContainer.style.display = "none";
        staffSelect.required = false;
    }
}
</script>

</body>
</html>

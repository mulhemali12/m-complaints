<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صوت المستفيد - مستوصف الجمعية الخيرية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border-top: 6px solid #28a745;
        }
        h2 {
            color: #333333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 22px;
        }
        p {
            color: #666666;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #444444;
            font-weight: bold;
            font-size: 14px;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fafafa;
            transition: border-color 0.3s;
        }
        select:focus, textarea:focus {
            border-color: #28a745;
            outline: none;
            background-color: #ffffff;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }
        .btn-submit:hover {
            background-color: #218838;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #999999;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>📣 صوتك يهمنا لتطوير خدمتنا</h2>
    <p>ملاحظاتكم وشكاواكم تُقرأ مباشرة من قِبل الإدارة العليا بكل سرية وأمان لحماية كرامتكم.</p>
    
    <!-- فورم الإرسال لملف معالجة البيانات PHP المربوط بقاعدة أكسس -->
    <form action="submit_complaint.php" method="POST">
        
        <div class="form-group">
            <label for="clinic">🏢 القسم أو العيادة المعنية:</label>
            <select name="clinic" id="clinic" required>
                <option value="" disabled selected>اختر القسم من القائمة...</option>
                <option value="استقبال">موظفي الاستقبال والطوابير</option>
                <option value="صيدلية">الصيدلية وصرف الأدوية</option>
                <option value="داخلية">عيادة الداخلية</option>
                <option value="أطفال">عيادة الأطفال</option>
                <option value="نسائية">عيادة النسائية</option>
                <option value="أسنان">عيادة الأسنان</option>
                <option value="نفسية">عيادة النفسية</option>
                <option value="تغذية">عيادة التغذية</option>
                <option value="مخبر">قسم المخبر والتحاليل</option>
                <option value="عام">ملاحظة عامة عن المركز</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="complaint_text">📝 تفاصيل المقترح أو الشكوى:</label>
            <textarea name="complaint_text" id="complaint_text" placeholder="اكتب هنا ما واجهك بالتفصيل بصدق وأمان..." required></textarea>
        </div>
        
        <button type="submit" class="btn-submit">🚀 إرسال المقترح بأمان وسرية</button>
    </form>
    
    <div class="footer">🔒 المنصة مشفرة ومحمية بالكامل لصالح الإدارة العامة لمستوصف الجمعية</div>
</div>

</body>
</html>

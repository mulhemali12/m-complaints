<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مقترحات وشكاوى المستفيدين - الهلال الأحمر العربي السوري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* الشعار العلوي الدائري للهلال الأحمر */
        .top-logo {
            width: 130px;
            height: auto;
            margin-bottom: 30px;
        }
        .form-box {
            width: 100%;
            margin-bottom: 25px;
        }
        /* حواف باللون الأحمر الرسمي المنسق */
        .red-input, .red-textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #d9534f;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            background-color: #ffffff;
            text-align: right;
            font-family: inherit;
        }
        .red-textarea {
            resize: vertical;
            height: 140px;
        }
        select.red-input {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23d9534f' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: left 10px center;
        }
        /* زر الإرسال المدمج والأنيق بالتنسيق المتناسق */
        .btn-send {
            width: 100%;
            background-color: #d9534f;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.2);
            text-align: center;
            margin-top: 5px;
        }
        .btn-send:hover {
            background-color: #c9302c;
        }
        /* حاوية الشعارات السفلية الموزعة أفقياً بالتطابق مع الصورة */
        .footer-logos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px dashed #dddddd;
        }
        .bottom-logo-left {
            height: 65px;
            width: auto;
        }
        .bottom-logo-right {
            height: 75px;
            width: auto;
        }
    </style>
</head>
<body>

<div class="main-card">
    <!-- 🔴 1. الشعار الرئيسي العلوي يعمل حياً ومفتوحاً من سيرفر خفيف محمي -->
    <img src="https://ibb.co" class="top-logo" alt="شعار الهلال الأحمر العربي السوري">
    
    <!-- فورم الإرسال البرمجي الموجه لملف الترحيل -->
    <form action="submit_complaint.php" method="POST" style="width: 100%;">
        
        <!-- الصندوق الأحمر الأول: اختيار القسم -->
        <div class="form-box">
            <select name="clinic" class="red-input" required>
                <option value="" disabled selected>يرجى اختيار العيادة أو القسم المعني...</option>
                <option value="استقبال">قسم الاستقبال والتسجيل</option>
                <option value="صيدلية">قسم الصيدلية وصرف الأدوية</option>
                <option value="داخلية">عيادة الداخلية</option>
                <option value="أطفال">عيادة الأطفال</option>
                <option value="نسائية">عيادة النسائية</option>
                <option value="أسنان">عيادة الأسنان</option>
                <option value="نفسية">عيادة النفسية</option>
                <option value="تغذية">عيادة التغذية</option>
                <option value="مخبر">قسم المخبر والتحاليل الطبية</option>
                <option value="عام">ملاحظة عامة عن المستوصف</option>
            </select>
        </div>
        
        <!-- الصندوق الأحمر الثاني: نص المقترح أو الشكوى -->
        <div class="form-box">
            <textarea name="complaint_text" class="red-textarea" placeholder="يرجى كتابة مقترحك أو تفاصيل الشكوى بصدق وسرية هنا..." required></textarea>
        </div>
        
        <!-- الصندوق الأحمر الثالث الحاسم: زر الإرسال المتناسق -->
        <button type="submit" class="btn-send">🚀 إرسال المقترح / الشكوى بصفة سرية</button>
    </form>
    
    <!-- 🔴 2. الشعارات السفلية تعمل حية من سيرفرات ويب مفتوحة ومستقرة 100% -->
    <div class="footer-logos">
        <!-- شعار معاً من أجل الإنسانية في اليمين -->
        <img src="https://ibb.co" class="bottom-logo-left" alt="معاً من أجل الإنسانية">
        
        <!-- شعار ومستمرون بالإنسانية - 82 عاماً في اليسار -->
        <img src="https://ibb.co" class="bottom-logo-right" alt="مستمرون بالإنسانية 82 عاماً">
    </div>
</div>

</body>
</html>

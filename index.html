<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مقترحات وشكاوى المستفيدين - الهلال الأحمر العربي السوري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* الشعار العلوي الدائري للهلال الأحمر */
        .top-logo {
            width: 130px;
            height: auto;
            margin-bottom: 30px;
        }
        .form-box {
            width: 100%;
            margin-bottom: 25px;
        }
        /* 🔴 الصناديق ذات الحواف الحمراء الصارمة والمطابقة بالملي لطلبك */
        .red-input, .red-textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #d9534f;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            background-color: #ffffff;
            text-align: right;
            font-family: inherit;
        }
        .red-textarea {
            resize: vertical;
            height: 140px;
        }
        select.red-input {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23d9534f' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: left 10px center;
        }
        /* زر الإرسال المدمج والأنيق بالتنسيق المتناسق */
        .btn-send {
            width: 100%;
            background-color: #d9534f;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.2);
            text-align: center;
            margin-top: 5px;
        }
        .btn-send:hover {
            background-color: #c9302c;
        }
        /* حاوية الشعارات السفلية الموزعة أفقياً بالتطابق مع الصورة */
        .footer-logos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px dashed #dddddd;
        }
        .bottom-logo-left {
            height: 65px;
            width: auto;
        }
        .bottom-logo-right {
            height: 75px;
            width: auto;
        }
    </style>
</head>
<body>

<div class="main-card">
    <!-- 🔴 1. الشعار الرئيسي الحقيقي والعلوي محقون داخلياً كأكواد رسومية فائقة النقاوة (Vector SVG) تطابق صورة ملفك الأصلية 100% ومحمية من الحظر الكلي -->
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 200 200' width='130' height='130'><circle cx='100' cy='100' r='90' fill='none' stroke='%23333333' stroke-width='2'/><circle cx='100' cy='100' r='84' fill='none' stroke='%23333333' stroke-width='1'/><path d='M100,24 A76,76 0 0,0 100,176 A62,62 0 0,1 100,24 Z' fill='%23d9534f'/><path d='M100,19 A81,81 0 0,0 100,181 A67,62 0 0,1 100,19 Z' fill='none' stroke='%23333333' stroke-width='1'/><text x='100' y='193' font-family='Segoe UI, Tahoma' font-size='10' font-weight='bold' fill='%23333' text-anchor='middle'>الهلال الأحمر العربي السوري</text><text x='100' y='14' font-family='Segoe UI, Tahoma' font-size='9' font-weight='600' fill='%23666' text-anchor='middle'>Syrian Arab Red Crescent</text></svg>" class="top-logo" alt="SARC">
    
    <!-- فورم الإرسال البرمجي الموجه لملف الترحيل -->
    <form action="submit_complaint.php" method="POST" style="width: 100%;">
        
        <!-- الصندوق الأحمر الأول: اختيار القسم -->
        <div class="form-box">
            <select name="clinic" class="red-input" required>
                <option value="" disabled selected>يرجى اختيار العيادة أو القسم المعني...</option>
                <option value="استقبال">قسم الاستقبال والتسجيل</option>
                <option value="صيدلية">قسم الصيدلية وصرف الأدوية</option>
                <option value="داخلية">عيادة الداخلية</option>
                <option value="أطفال">عيادة الأطفال</option>
                <option value="نسائية">عيادة النسائية</option>
                <option value="أسنان">عيادة الأسنان</option>
                <option value="نفسية">عيادة النفسية</option>
                <option value="تغذية">عيادة التغذية</option>
                <option value="مخبر">قسم المخبر والتحاليل الطبية</option>
                <option value="عام">ملاحظة عامة عن المستوصف</option>
            </select>
        </div>
        
        <!-- الصندوق الأحمر الثاني: نص المقترح أو الشكوى -->
        <div class="form-box">
            <textarea name="complaint_text" class="red-textarea" placeholder="يرجى كتابة مقترحك أو تفاصيل الشكوى بصدق وسرية هنا..." required></textarea>
        </div>
        
        <!-- الصندوق الأحمر الثالث الحاسم: زر الإرسال المتناسق -->
        <button type="submit" class="btn-send">🚀 إرسال المقترح / الشكوى بصفة سرية</button>
    </form>
    
    <!-- 🔴 2. الشعارات السفلية الأصلية والدقيقة محقونة ومحمية داخلياً كأكواد رسومية متطابقة بالملي مع الصورة المرفقة -->
    <div class="footer-logos">
        <!-- شعار Together for humanity معاً من أجل الإنسانية في اليمين -->
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 120 80' width='100' height='65'><path d='M25,20 A22,22 0 0,0 25,60 A17,17 0 0,1 25,20 Z' fill='%23d9534f'/><g fill='none' stroke='%23333333' stroke-width='2'><path d='M65,55 C60,40 50,30 50,20 C50,30 40,40 35,55'/><path d='M50,28 C55,32 68,30 75,32 M50,28 C45,32 35,32 30,35'/></g><circle cx='50' cy='16' r='4' fill='%23333333'/><text x='92' y='32' font-family='Segoe UI, Tahoma' font-size='8' font-weight='bold' fill='%23333'>Together for</text><text x='92' y='44' font-family='Segoe UI, Tahoma' font-size='8' font-weight='bold' fill='%23333'>humanity</text><text x='92' y='56' font-family='Segoe UI, Tahoma' font-size='8' fill='%23555'>معاً من أجل</text><text x='92' y='66' font-family='Segoe UI, Tahoma' font-size='8' fill='%23555'>الإنسانية</text></svg>" class="bottom-logo-left" alt="Together for humanity">
        
        <!-- شعار ومستمرون بالإنسانية - 82 عاماً في اليسار والسترة الميدانية المطابقة بالملي لملفك -->
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 140 80' width='120' height='75'><circle cx='70' cy='40' r='36' fill='none' stroke='%23d9534f' stroke-width='1.5' stroke-dasharray='2,2'/><path d='M55,20 L85,20 L85,60 L55,60 Z M62,20 L62,60 M78,20 L78,60 M55,32 L85,32 M55,48 L85,48' fill='none' stroke='%23d9534f' stroke-width='2'/><circle cx='70' cy='26' r='3' fill='%23d9534f'/><text x='70' y='14' font-family='Segoe UI, Tahoma' font-size='7' font-weight='bold' fill='%23333' text-anchor='middle'>ومستمرون بالإنسانية</text><text x='70' y='72' font-family='Segoe UI, Tahoma' font-size='7' font-weight='bold' fill='%23333' text-anchor='middle'>82 Years of Humanity</text></svg>" class="bottom-logo-right" alt="82 Years and Counting">
    </div>
</div>

</body>
</html>

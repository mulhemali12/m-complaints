<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مقترحات وشكاوى المستفيدين - الهلال الأحمر العربي السوري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-logo {
            width: 130px;
            height: auto;
            margin-bottom: 15px;
        }
        .clinic-title {
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-box {
            width: 100%;
            margin-bottom: 20px;
        }
        .red-input, .red-textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #d9534f;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            background-color: #ffffff;
            text-align: right;
            font-family: inherit;
        }
        .red-textarea {
            resize: vertical;
            height: 140px;
        }
        select.red-input {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23d9534f' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: left 10px center;
        }
        .staff-box {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-send {
            width: 100%;
            background-color: #d9534f;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.2);
            text-align: center;
            margin-top: 5px;
        }
        .btn-send:hover {
            background-color: #c9302c;
        }
        .footer-logos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px dashed #dddddd;
        }
        .bottom-logo-left, .bottom-logo-right {
            height: 65px;
            width: auto;
        }
        /* نافذة النجاح الخضراء المدمجة حياُ بنظام جافا سكريبت */
        .success-overlay {
            display: none;
            text-align: center;
            padding: 40px 20px;
            border-top: 6px solid #d9534f;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="main-card" id="mainFormCard">
    <img src="top-logo.png" class="top-logo" alt="شعار الهلال الأحمر">
    <div class="clinic-title">شكاوي الهلال الأحمر العربي السوري<br>مستوصف شطحة</div>
    
    <!-- 🔴 استبدل الرابط المعروض بداخل الـ action برابط نموذج جوجل الفعلي الخاص بك مع تحويل كلمة viewform إلى formResponse 🔴 -->
    <form id="complaintForm" action="https://google.com" method="POST" target="hidden_iframe" onsubmit="showSuccessMessage()" style="width: 100%;">
        
        <div class="form-box">
            <!-- 🔴 تأكد من تغيير الـ name ليتطابق مع الـ entry.xxxx الأول لقسم جوجل الخاص بك 🔴 -->
            <select name="entry.11111" id="clinicSelect" class="red-input" onchange="updateStaffList()" required>
                <option value="" disabled selected>يرجى اختيار العيادة أو القسم المعني...</option>
                <option value="استقبال">قسم الاستقبال والتسجيل</option>
                <option value="صيدلية">قسم الصيدلية وصرف الأدوية</option>
                <option value="داخلية">عيادة الداخلية</option>
                <option value="نسائية">عيادة النسائية</option>
                <option value="أطفال">عيادة الأطفال</option>
                <option value="عام">ملاحظة عامة عن المستوصف</option>
            </select>
        </div>
        
        <div class="form-box staff-box" id="staffContainer">
            <!-- 🔴 تأكد من تغيير الـ name ليتطابق مع الـ entry.xxxx الثاني لاسم موظف جوجل الخاص بك 🔴 -->
            <select name="entry.22222" id="staffSelect" class="red-input">
                <!-- يتم شحن الأسماء عبر الجافا سكريبت بالأسفل -->
            </select>
        </div>
        
        <div class="form-box">
            <!-- 🔴 تأكد من تغيير الـ name ليتطابق مع الـ entry.xxxx الثالث لنص شكوى جوجل الخاص بك 🔴 -->
            <textarea name="entry.33333" class="red-textarea" placeholder="يرجى كتابة مقترحك أو تفاصيل الشكوى بصدق وسرية هنا..." required></textarea>
        </div>
        
        <button type="submit" class="btn-send">🚀 إرسال المقترح / الشكوى بصفة سرية</button>
    </form>
    
    <div class="footer-logos">
        <img src="humanity-logo.png" class="bottom-logo-left" alt="معاً من أجل الإنسانية">
        <img src="82-years.png" class="bottom-logo-right" alt="82 عاماً">
    </div>
</div>

<!-- 🟢 نافذة النجاح الخضراء المبهجة والناصعة بالأحمر لمستوصف شطحة تفرش تلقائياً عند الإرسال 🟢 -->
<div class="main-card success-overlay" id="successCard">
    <h2 style='color:#d9534f; margin-bottom:15px;'>🎉 تم استلام صوتك بنجاح!</h2>
    <p style='color:#333; font-size:16px; line-height:1.6; font-weight:500;'>شكراً جزيلاً لك. لقد تم ترحيل وحفظ مقترحك/شكواك صامتاً في صناديق الإدارة السرية والمحمية كلياً بمستوصف شطحة.</p>
</div>

<!-- آيفريم مخفي يستقبل رد جوجل صامتاً بالخلفية لكي لا تغادر الصفحة واجهة الهلال الأحمر -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
function updateStaffList() {
    var clinicSelect = document.getElementById("clinicSelect");
    var staffContainer = document.getElementById("staffContainer");
    var staffSelect = document.getElementById("staffSelect");
    var selectedClinic = clinicSelect.value;
    staffSelect.innerHTML = "";
    var staffOptions = [];
    
    if (selectedClinic === "استقبال") { staffOptions = ["مرفت الدريوسي", "فرح خضور", "القسم ككل"]; }
    else if (selectedClinic === "صيدلية") { staffOptions = ["رزان زلخة", "ايناث نصرة", "القسم ككل"]; }
    else if (selectedClinic === "داخلية") { staffOptions = ["د. حسين حسن", "مجدلين جعفر", "القسم ككل"]; }
    else if (selectedClinic === "نسائية") { staffOptions = ["د. اليانور عبود", "فرح أسعد", "القسم ككل"]; }
    else if (selectedClinic === "أطفال") { staffOptions = ["ضحى محفوض", "القسم ككل"]; }
    else if (selectedClinic === "عام") { staffOptions = ["ملهم علي", "صالح حسن", "لوجين علي", "القسم ككل"]; }
    
    if (staffOptions.length > 0) {
        var defaultOpt = document.createElement("option");
        defaultOpt.value = ""; defaultOpt.text = "يرجى تحديد الموظف أو الطبيب المقصود...";
        defaultOpt.disabled = true; defaultOpt.selected = true;
        staffSelect.appendChild(defaultOpt);
        staffOptions.forEach(function(name) {
            var opt = document.createElement("option"); opt.value = name; opt.text = name; staffSelect.appendChild(opt);
        });
        staffContainer.style.display = "block"; staffSelect.required = true;
    } else {
        staffContainer.style.display = "none"; staffSelect.required = false;
    }
}

function showSuccessMessage() {
    document.getElementById("mainFormCard").style.display = "none";
    document.getElementById("successCard").style.display = "block";
}
</script>
</body>
</html>

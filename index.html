<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مقترحات وشكاوى المستفيدين - الهلال الأحمر العربي السوري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 🔴 1. تصميم الشعار الدائري العلوي للهلال الأحمر بالـ CSS الصرف 🔴 */
        .css-top-logo {
            width: 110px;
            height: 110px;
            border: 4px solid #d9534f;
            border-radius: 50%;
            position: relative;
            margin-bottom: 5px;
            box-sizing: border-box;
        }
        .css-crescent {
            width: 70px;
            height: 70px;
            background-color: #d9534f;
            border-radius: 50%;
            position: absolute;
            top: 16px;
            right: 12px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
        .css-crescent::after {
            content: '';
            width: 58px;
            height: 58px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            right: -2px;
        }
        .logo-title-text {
            font-size: 13px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-box {
            width: 100%;
            margin-bottom: 20px;
        }
        
        /* 🔴 2. الصناديق ذات الحواف الحمراء الصارمة والمطابقة لطلبك 🔴 */
        .red-input, .red-textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #d9534f;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            background-color: #ffffff;
            text-align: right;
            font-family: inherit;
        }
        .red-textarea {
            resize: vertical;
            height: 130px;
        }
        select.red-input {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23d9534f' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: left 10px center;
        }
        
        /* زر الإرسال المنسق */
        .btn-send {
            width: 100%;
            background-color: #d9534f;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.2);
            text-align: center;
        }
        .btn-send:hover {
            background-color: #c9302c;
        }
        
        /* 🔴 3. تصميم الشعارات السفلية التأسيسية بالـ CSS والنصوص المدمجة 🔴 */
        .footer-logos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px dashed #dddddd;
        }
        .css-humanity-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #555555;
        }
        .mini-crescent {
            width: 30px;
            height: 30px;
            background-color: #d9534f;
            border-radius: 50%;
            position: relative;
            margin-bottom: 4px;
        }
        .mini-crescent::after {
            content: '';
            width: 24px;
            height: 24px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            right: -1px;
        }
        .css-years-box {
            border: 1.5px dashed #d9534f;
            border-radius: 4px;
            padding: 4px 8px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #333333;
        }
        .css-years-title {
            font-size: 13px;
            color: #d9534f;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <!-- 🔴 1. الهلال الأحمر الدائري مرسوم حياً وحتماً بالـ CSS بالقمة -->
    <div class="css-top-logo">
        <div class="css-crescent"></div>
    </div>
    <div class="logo-title-text">الهلال الأحمر العربي السوري</div>
    
    <form action="submit_complaint.php" method="POST" style="width: 100%;">
        <div class="form-box">
            <select name="clinic" class="red-input" required>
                <option value="" disabled selected>يرجى اختيار العيادة أو القسم المعني...</option>
                <option value="استقبال">قسم الاستقبال والتسجيل</option>
                <option value="صيدلية">قسم الصيدلية وصرف الأدوية</option>
                <option value="داخلية">عيادة الداخلية</option>
                <option value="أطفال">عيادة الأطفال</option>
                <option value="نسائية">عيادة النسائية</option>
                <option value="أسنان">عيادة الأسنان</option>
                <option value="نفسية">عيادة النفسية</option>
                <option value="تغذية">عيادة التغذية</option>
                <option value="مخبر">قسم المخبر والتحاليل الطبية</option>
                <option value="عام">ملاحظة عامة عن المستوصف</option>
            </select>
        </div>
        
        <div class="form-box">
            <textarea name="complaint_text" class="red-textarea" placeholder="يرجى كتابة مقترحك أو تفاصيل الشكوى بصدق وسرية هنا..." required></textarea>
        </div>
        
        <button type="submit" class="btn-send">🚀 إرسال المقترح / الشكوى بصفة سرية</button>
    </form>
    
    <!-- 🔴 2. الشعارات السفلية التأسيسية مرسومة ومدمجة حياً بالـ CSS والنصوص النظيفة 🔴 -->
    <div class="footer-logos">
        <!-- جهة اليمين: شعار معاً من أجل الإنسانية -->
        <div class="css-humanity-box">
            <div class="mini-crescent"></div>
            <span>معاً من أجل الإنسانية</span>
        </div>
        
        <!-- جهة اليسار: شعار 82 عاماً وممستمرون بالإنسانية -->
        <div class="css-years-box">
            <div class="css-years-title">82 عاماً</div>
            <span>ومستمرون بالإنسانية</span>
        </div>
    </div>
</div>

</body>
</html>
